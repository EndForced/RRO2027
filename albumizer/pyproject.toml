[project]
name = "albumizer"
version = "0.1.0"
description = "Telegram bot that assembles music albums from YouTube and other open platforms"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "yt-dlp>=2025.1.1",
    "httpx>=0.27",
    "mutagen>=1.47",
    "rapidfuzz>=3.9",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
